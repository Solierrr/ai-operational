openapi: 3.1.0
info:
  title: Solaria — ai-operational
  description: 'Agente que ajuda o usuário a operar o SaaS da Solaria: indica a tela certa do web-app e propõe ações (hoje,
    cadastrar uma oferta de placa) que só são executadas no api-core depois do aceite do usuário. Autentique com o JWT do
    api-auth (bearerAuth). O A2A, usado pelo ai-assistant, não faz parte deste contrato: o Agent Card fica em /.well-known/agent-card.json.'
  contact:
    name: Solaria
    url: https://github.com/Solierrr
  license:
    name: CC0-1.0
    url: https://creativecommons.org/publicdomain/zero/1.0/
  version: 0.2.0 # x-release-please-version
servers:
- url: https://ai-operational.onrender.com
  description: QA
- url: http://localhost:8000
  description: Local
paths:
  /chat:
    post:
      tags:
      - Conversa
      summary: Envia uma mensagem ao agente operacional
      description: 'Roda um turno da conversa com o JWT do usuário, validado no api-auth antes do turno. Recusa do guardrail,
        fallback e falha de ferramenta não são erro HTTP: voltam 200 com outcome e reason. Ações que gravam dados são só propostas
        e dependem do aceite do usuário no turno seguinte.'
      operationId: sendChatMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '401':
          description: Token ausente, inválido ou expirado
          content: &id001
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: A conversa pertence a outro usuário
          content: *id001
        '422':
          description: Corpo da requisição inválido
          content: *id001
        '503':
          description: Validação do JWT não configurada
          content: *id001
        '500':
          description: Erro interno inesperado
          content: *id001
      security:
      - bearerAuth: []
      x-error-codes:
      - UNAUTHENTICATED
      - FORBIDDEN
      - VALIDATION_FAILED
      - DEPENDENCY_UNAVAILABLE
      - INTERNAL_ERROR
  /health:
    get:
      tags:
      - Saúde
      summary: Indica se o processo está vivo
      description: Só o processo, sem consultar dependências; traz a versão do release.
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Erro interno inesperado
          content: *id001
      security: []
      x-error-codes:
      - INTERNAL_ERROR
  /ready:
    get:
      tags:
      - Saúde
      summary: Indica se o serviço está pronto para atender
      description: Consulta só o MongoDB (checkpointer e memória do agente), com timeout de 2 segundos. Provedores de LLM
        ficam de fora porque há fallback entre eles. Responde 503 com {"status":"DOWN"} quando o banco não responde.
      operationId: getReady
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Serviço não pronto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '500':
          description: Erro interno inesperado
          content: *id001
      security: []
      x-error-codes:
      - INTERNAL_ERROR
components:
  schemas:
    ChatRequest:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
          description: Identificador da conversa, escolhido pelo cliente e reaproveitado a cada turno.
          examples:
          - b2b-empresa-42
        message:
          type: string
          minLength: 1
          title: Message
          description: Mensagem do usuário.
          examples:
          - Onde cadastro uma oferta de placa?
      type: object
      required:
      - conversation_id
      - message
      title: ChatRequest
      description: O que o cliente envia no POST /chat.
    ChatResponse:
      properties:
        response:
          type: string
          title: Response
          description: Resposta do assistente para mostrar ao usuário.
          examples:
          - A tela de ofertas fica em Fornecedor > Ofertas.
        outcome:
          $ref: '#/components/schemas/Outcome'
          description: 'Resultado do turno: ANSWERED (respondido), REFUSED (o guardrail recusou), DEGRADED (houve fallback
            e a resposta é genérica) ou TOOL_FAILED (uma ferramenta falhou e a resposta saiu sem ela).'
          default: ANSWERED
        reason:
          anyOf:
          - $ref: '#/components/schemas/Reason'
          - type: 'null'
          description: Código do motivo, no catálogo de erros, quando outcome não é ANSWERED.
          examples:
          - OUT_OF_SCOPE
        specialists_used:
          items:
            type: string
          type: array
          title: Specialists Used
          description: Especialistas consultados no turno.
          examples:
          - - screen_finder
        workflow_steps:
          items:
            type: string
          type: array
          title: Workflow Steps
          description: Etapas do grafo percorridas no turno.
          examples:
          - - input_guardrail_approved
            - router
            - screen_finder
      type: object
      required:
      - response
      title: ChatResponse
      description: O que a API devolve no POST /chat.
    HealthResponse:
      properties:
        status:
          type: string
          const: UP
          title: Status
          examples:
          - UP
        version:
          type: string
          title: Version
          examples:
          - 0.1.1
      type: object
      required:
      - status
      - version
      title: HealthResponse
    Outcome:
      type: string
      enum:
      - ANSWERED
      - REFUSED
      - DEGRADED
      - TOOL_FAILED
      title: Outcome
    ReadyResponse:
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
          title: Status
          examples:
          - UP
      type: object
      required:
      - status
      title: ReadyResponse
    Reason:
      type: string
      enum:
      - OUT_OF_SCOPE
      - MANIPULATION_ATTEMPT
      - INTERNAL_DATA_REQUEST
      - FALSE_INFORMATION
      - GUARDRAIL_REFUSED
      - GUARDRAIL_UNAVAILABLE
      - ANSWER_REJECTED
      - ACTION_FAILED
      title: Reason
    ProblemFieldError:
      properties:
        field:
          examples:
          - message
          title: Field
          type: string
        errorCode:
          examples:
          - VALIDATION_FAILED
          title: Errorcode
          type: string
        detail:
          examples:
          - String should have at least 1 character
          title: Detail
          type: string
      required:
      - field
      - errorCode
      - detail
      title: ProblemFieldError
      type: object
    ProblemDetail:
      description: Corpo de todo erro HTTP do serviço.
      properties:
        type:
          examples:
          - about:blank
          title: Type
          type: string
        title:
          examples:
          - UNAUTHENTICATED
          title: Title
          type: string
        status:
          examples:
          - 401
          title: Status
          type: integer
        errorCode:
          examples:
          - UNAUTHENTICATED
          title: Errorcode
          type: string
        detail:
          examples:
          - Token ausente ou inválido.
          title: Detail
          type: string
        instance:
          examples:
          - /chat
          title: Instance
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        traceId:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Traceid
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/ProblemFieldError'
            type: array
          - type: 'null'
          default: null
          title: Errors
      required:
      - type
      - title
      - status
      - errorCode
      - detail
      - instance
      - timestamp
      title: ProblemDetail
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Conversa
  description: Turnos da conversa com o agente operacional
- name: Saúde
  description: Vivo e pronto, para a plataforma e o monitoramento
security:
- bearerAuth: []
